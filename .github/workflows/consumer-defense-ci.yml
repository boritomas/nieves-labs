name: Consumer Defense CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [founder-consumer-defense-lab]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Platform integrity
        run: npm run check:platform

      - name: Build
        run: npm run build
        env:
          APP_BASE_URL: https://nieves-labs.com
          NEXT_PUBLIC_APP_BASE_URL: https://nieves-labs.com
          ADMIN_TOKEN: ci-placeholder-token
